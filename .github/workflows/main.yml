name: Shopstar Daily Scraper

on:
  schedule:
    # Se ejecuta todos los días a las 07:00 UTC (02:00 AM hora de Perú)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install pandas openpyxl playwright psycopg2-binary
          playwright install --with-deps chromium

      - name: Ejecutar Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python shopstar_scraper.py --max-pages 20

      - name: Guardar artefactual de salida (CSV/Excel)
        uses: actions/upload-artifact@v4
        with:
          name: shopstar-data
          path: output/
