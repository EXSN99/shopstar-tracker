name: Pruebas Python
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias de ejecución y pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-scraper.txt pytest
      - name: Validar integridad de dependencias
        run: |
          python -m pip check
          python -c "import psycopg, playwright, openpyxl, pandas, streamlit, plotly; import db, run_pipeline; print('DEPENDENCIAS_OK: psycopg 3 + scraper + PostgreSQL')"
      - name: Ejecutar pruebas
        run: python -m pytest -q
      - name: Comprobar sintaxis
        run: python -m compileall -q .
